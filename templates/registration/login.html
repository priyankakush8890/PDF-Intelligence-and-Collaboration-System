{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5 card p-4">

        <h2>Login</h2>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button class="btn btn-primary w-100">
                Login
            </button>
        </form>

        <p class="mt-3 mb-1">
            <a href="{% url 'password_reset' %}">
                Forgot your password?
            </a>
        </p>

        <p>
            New user?
            <a href="/signup/">
                Create account
            </a>
        </p>

    </div>
</div>

{% endblock %}
