<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF Intelligence</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f5f7fb}.navbar-brand{font-weight:700}.card{border:0;box-shadow:0 4px 18px #00000010}.summary{white-space:pre-line}.chat-box{height:420px;overflow:auto;background:#fff;border:1px solid #ddd;border-radius:8px;padding:12px}.msg{padding:9px 12px;border-radius:10px;margin:7px 0}.user{background:#e8f0fe}.assistant{background:#f1f3f5}</style>
</head><body><nav class="navbar navbar-dark bg-dark"><div class="container"><a class="navbar-brand" href="/">PDF Intelligence</a><div>{% if user.is_authenticated %}<span class="text-white me-2">Hi, {{user.username}}</span><a class="btn btn-outline-light btn-sm" href="/upload/">Upload</a> <a class="btn btn-warning btn-sm" href="/logout/">Logout</a>{% endif %}</div></div></nav><main class="container py-4">{% block content %}{% endblock %}</main></body></html>
